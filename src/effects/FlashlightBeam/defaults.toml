[_Shaders.FlashlightBeam.Main]
FirstPerson = true                     # Show the shaft in first person
ThirdPerson = true                     # Show the shaft in third person
Strength = 1.0                         # Amount of light scattered by the air in the beam
Anisotropy = 0.45                      # Forward scattering. Higher makes the shaft brighter when looking along the beam
HeightFalloff = 1.0                    # How quickly the airborne dust thins out with height
MaxDistance = 1500.0                   # Distance in units past which the march stops
FirstPersonStrength = 0.15             # Strength floor in first person, where the light sits on the camera and there is no parallax
FirstPersonOffsetRight = 8.0           # Sideways offset of the virtual light the first person march uses, to create that parallax
FirstPersonOffsetDown = 4.0            # Downward offset of the same virtual light

[_Shaders.FlashlightBeam.Status]
Enabled = true                         # Volumetric light shaft in the air along the flashlight cone. Requires the Flashlight shader


