[_Shaders.LUT.Main]
DayLUT          = 'neutral_lut.png'    # Filename of the day LUT in Data/Textures/VegasShaders/LUTs/: a .cube file, or a PNG/DDS/BMP horizontal strip N*N wide and N high (256x16, 1024x32, 1089x33, 4096x64...). Other image shapes are ignored and logged.
NightLUT        = 'neutral_lut.png'    # Filename of the night LUT.
InteriorLUT     = 'neutral_lut.png'    # Filename of the interior LUT.
Strength        = 1.0                  # Overall LUT blend strength (0.0 = no effect, 1.0 = full).
PreTonemapping  = false                # Apply LUT before game tonemapping (HDR input). Requires HDR LUTs or HDRCompat mode.
HDRCompat       = true                 # Normalize HDR input to LUT range using max-channel scale. Disable if using a converted float16 DDS HDR LUT.

[_Shaders.LUT.Status]
Enabled = true                         # Applies a color lookup table. Ships with a neutral LUT so the default is a no-op until you swap in your own.

