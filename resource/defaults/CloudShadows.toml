[_Shaders.CloudShadows.Main]
Enabled = false                      # UNOFFICIAL (2026-10-19) Cloud shadows: the game's own cloud layers cast moving shadows on the land, dimming only the sunlight (shade keeps its sky light). Cheap (a few texture reads per pixel); no volumetric clouds needed. Not the same as the volumetric clouds' shadows (Volumetric Clouds, Shadows): while those are on, they are used and this switch does nothing. In the menu: under Shadows Exteriors. After Community Shaders' Cloud Shadows (GPL-3.0); this build's own version for DirectX 9.
Strength = 0.6                       # [0-1] (2026-10-19) How much of the sun a fully clouded patch of sky takes.
Density = 3.0                        # [0-8] (2026-10-19) How solid the clouds count: their pictures' cover times this. Thin, wispy cloud pictures need more to cast a visible shadow (faint, wispy clear-sky clouds still cast little shade at 3).
Height = 140000.0                    # [1000-1000000] (2026-10-19) How high above you the clouds' shadows are cast from, in game units (140000 = about 2 km, as Community Shaders). Higher: the shadows move further from the clouds' spot overhead as the sun gets low.
TileSize = 400000.0                  # [1000-10000000] (2026-10-19) How much land one cloud picture covers, in game units. Smaller: smaller, more frequent cloud shadows.
Speed = 1.0                          # [0-20] (2026-10-19) How fast the cloud shadows drift with the weather's wind (the higher cloud layers faster).
DebugView = 0                        # (2026-10-19) 1: the clouds' shadow tinted blue (and the land's green) over the picture. 3 (2026-10-23): also the water's depth as WaterShadows reads it, white at the shore to red deep. 4 (2026-10-25, test): as a full cloud over the whole sky (Strength 1): the sunlit ground should come out as dark as the tree and object shadows on it, never darker.
WaterShadows = false                 # UNOFFICIAL (2026-10-23), live: cloud (and mountain) shadows also fall on water, by its depth: shallow water, where you see the ground through it, keeps nearly all of the shadow and deep water a small share (WaterDeepShare). Off: water takes no shadow at all, so a cloud's shadow on the sand ends in a hard line at the waterline. Uses the game's own water depth map; costs next to nothing.
WaterDeepShare = 0.2                 # [0-1] (2026-10-23) With WaterShadows on: how much of the shadow deep water keeps (its look is mostly the sky's reflection). 0: none, 1: as much as the land.
TargetFix = false                    # UNOFFICIAL BUG FIX candidate (2026-10-22): before the mountain/cloud shadow pass draws, its own picture is taken off every texture slot it was left on (the sun-shadow composite leaves it there) and the pass draws full screen whatever the game left set. Aimed at the DXVK-only report of the ground going darker on single frames under clouds. Off = as before.
HazardLog = 0                        # Test only (2026-10-22): 1 = the log says which texture slots still hold that pass's picture while it draws, and its draw states.
FlickerWatch = 0                     # Test only (2026-10-23): 1 = outdoors, every frame the finished picture is measured (shrunk, read back two frames later) and a frame whose lower half suddenly gets lighter or darker while the sky stays the same is written to the log ('FLICKER' lines) with how that frame drew the shadows. Costs a little GPU time; leave 0.
FlickerThreshold = 0.06              # [0.01-0.5] Test only (2026-10-23): with FlickerWatch, how big a jump (0.06 = 6%) is logged.
JitterFix = true                     # UNOFFICIAL BUG FIX (2026-10-31, on by default; Developer options only), live: with TAA's jitter on, the cloud (and land) shadow pass rebuilds each pixel's position on the ray the jittered picture was drawn on. Fixes a crusty, fast-flickering cloud shadow near you with TAA (and FSR RenderScale) on. With the DXVK fork this pass runs on Direct3D 9 while this or SkipCascadeCheck is on (the same picture). Off = as before.
SkipCascadeCheck = true              # UNOFFICIAL BUG FIX (2026-10-31, on by default; Developer options only), live: the cloud shadow no longer re-reads the sun's shadow maps to leave already-shadowed ground alone. That re-read drew a hard circle round you, inside which the cloud shadow came out crusty, with TAA / FSR RenderScale on. Trade-off: ground already in a sun shadow also takes the cloud's darkening (a little too dark there). Off = as before.
OldSunModel = false                  # Test only (2026-10-25): true = the cloud and mountain shadows as before that day's fix, when they took the ground's sunlight for more than it was (the land is lit by a lower sun than the rest, and the game's fog was darkened too): a tree's shadow under a cloud's shadow then came out lighter than the clouded ground round it. Leave false.

